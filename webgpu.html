<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Heimdall — WebGPU 3D Volume Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #080a0f; color: #e2e8f0; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .hud-panel {
      position: absolute; top: 20px; left: 20px; width: 320px;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
      padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); z-index: 10;
    }
    .hud-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .hud-title { font-size: 16px; font-weight: 700; color: #38bdf8; letter-spacing: 0.5px; }
    .badge { font-size: 10px; font-weight: 700; background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 12px; text-transform: uppercase; }
    .control-group { margin-bottom: 14px; }
    .control-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
    input[type=range] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
    .hud-footer { font-size: 11px; color: #64748b; margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
    #error-modal {
      display: none; position: absolute; inset: 0; background: rgba(8, 10, 15, 0.95);
      z-index: 100; align-items: center; justify-content: center; padding: 20px;
    }
    .error-card { background: #1e1b4b; border: 1px solid #6366f1; border-radius: 12px; padding: 30px; max-width: 500px; text-align: center; }
    .error-card h2 { color: #f43f5e; margin-bottom: 10px; }
    .error-card p { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="webgpu-canvas"></canvas>

    <div class="hud-panel">
      <div class="hud-header">
        <span class="hud-title">HEIMDALL 3D</span>
        <span class="badge" id="gpu-badge">WebGPU</span>
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Density Threshold (Bone/Tissue)</span>
          <span id="threshold-val">0.35</span>
        </div>
        <input type="range" id="threshold-slider" min="0.10" max="0.70" step="0.01" value="0.35" />
      </div>

      <div class="control-group">
        <div class="control-label">
          <span>Opacity Scale</span>
          <span id="opacity-val">12.0</span>
        </div>
        <input type="range" id="opacity-slider" min="1.0" max="30.0" step="0.5" value="12.0" />
      </div>

      <div class="hud-footer">
        <div>• <b>Left Click + Drag:</b> Rotate Skull</div>
        <div>• <b>Scroll Wheel:</b> Zoom In / Out</div>
      </div>
    </div>

    <div id="error-modal">
      <div class="error-card">
        <h2>WebGPU Not Available</h2>
        <p>Your browser or graphics hardware does not currently support WebGPU.</p>
      </div>
    </div>
  </div>

  <script>
    function mat4Perspective(out, fovy, aspect, near, far) {
      const f = 1.0 / Math.tan(fovy / 2);
      const nf = 1.0 / (near - far);
      out.fill(0);
      out[0] = f / aspect;
      out[5] = f;
      out[10] = far * nf;
      out[11] = -1;
      out[14] = far * near * nf;
    }

    function mat4LookAt(out, eye, target, up) {
      let z0 = eye[0] - target[0], z1 = eye[1] - target[1], z2 = eye[2] - target[2];
      let len = 1 / (Math.hypot(z0, z1, z2) || 1);
      z0 *= len; z1 *= len; z2 *= len;

      let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
      len = 1 / (Math.hypot(x0, x1, x2) || 1);
      x0 *= len; x1 *= len; x2 *= len;

      let y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;

      out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
      out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
      out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
      out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
      out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
      out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
      out[15] = 1;
    }

    function mat4Multiply(out, a, b) {
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
      const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

      let b0  = b[0], b1 = b[1], b2 = b[2], b3 = b[3];
      out[0] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      out[1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      out[2] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      out[3] = b0*a03 + b1*a13 + b2*a23 + b3*a33;

      b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
      out[4] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      out[5] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      out[6] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      out[7] = b0*a03 + b1*a13 + b2*a23 + b3*a33;

      b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
      out[8] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      out[9] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      out[10] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      out[11] = b0*a03 + b1*a13 + b2*a23 + b3*a33;

      b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
      out[12] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      out[13] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      out[14] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      out[15] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
    }

    function mat4Invert(out, a) {
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
      const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

      const b00 = a00 * a11 - a01 * a10;
      const b01 = a00 * a12 - a02 * a10;
      const b02 = a00 * a13 - a03 * a10;
      const b03 = a01 * a12 - a02 * a11;
      const b04 = a01 * a13 - a03 * a11;
      const b05 = a02 * a13 - a03 * a12;
      const b06 = a20 * a31 - a21 * a30;
      const b07 = a20 * a32 - a22 * a30;
      const b08 = a20 * a33 - a23 * a30;
      const b09 = a21 * a32 - a22 * a31;
      const b10 = a21 * a33 - a23 * a31;
      const b11 = a22 * a33 - a23 * a32;

      let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
      if (!det) return;
      det = 1.0 / det;

      out[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
      out[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
      out[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
      out[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
      out[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
      out[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
      out[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
      out[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
      out[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
      out[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
      out[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
      out[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
      out[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
      out[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
      out[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
      out[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
    }

    function generateAnatomicalVolume(dimX, dimY, dimZ) {
      const data = new Uint8Array(dimX * dimY * dimZ);
      const cx = dimX / 2, cy = dimY / 2, cz = dimZ / 2;

      for (let z = 0; z < dimZ; z++) {
        for (let y = 0; y < dimY; y++) {
          for (let x = 0; x < dimX; x++) {
            const idx = x + y * dimX + z * dimX * dimY;
            const nx = (x - cx) / (dimX / 2);
            const ny = (y - cy) / (dimY / 2);
            const nz = (z - cz) / (dimZ / 2);

            // Cranium (Top)
            const craniumOuter = (nx*nx)/(0.55*0.55) + (ny*ny)/(0.68*0.68) + (nz*nz)/(0.55*0.55);
            const craniumInner = (nx*nx)/(0.46*0.46) + (ny*ny)/(0.58*0.58) + (nz*nz)/(0.46*0.46);

            // Jaw (Bottom Front)
            const jaw = (nx*nx)/(0.42*0.42) + ((ny+0.35)*(ny+0.35))/(0.22*0.22) + ((nz-0.12)*(nz-0.12))/(0.38*0.38);

            // Eye Sockets
            const eyeL = Math.hypot(nx - 0.20, ny - 0.12, nz - 0.42);
            const eyeR = Math.hypot(nx + 0.20, ny - 0.12, nz - 0.42);

            // Nasal Cavity
            const nose = Math.hypot(nx, ny + 0.08, nz - 0.45);

            // Spine (Bottom Back)
            const spineDist = Math.hypot(nx, nz + 0.28);

            let density = 0;

            const isCranium = (craniumOuter <= 1.0 && craniumInner >= 1.0 && ny > -0.38);
            const isJaw = (jaw <= 1.0 && ny <= -0.18 && nz > -0.2);
            const isSpine = (spineDist < 0.12 && ny <= -0.25);

            if (isCranium || isJaw || isSpine) {
              density = 220; // Bone Density
            } else if (craniumInner < 1.0 && ny > -0.25) {
              density = 100; // Soft Tissue
            }

            // Hollow cavities
            if (eyeL < 0.14 || eyeR < 0.14 || nose < 0.11) {
              density = 0;
            }

            data[idx] = density;
          }
        }
      }
      return data;
    }

    const wgslShader = `
      struct Uniforms {
        invViewProj  : mat4x4<f32>,
        threshold    : f32,
        densityScale : f32,
        pad0         : f32,
        pad1         : f32,
      };

      @group(0) @binding(0) var<uniform> uniforms : Uniforms;
      @group(0) @binding(1) var volumeTexture   : texture_3d<f32>;
      @group(0) @binding(2) var volumeSampler   : sampler;

      struct VertexOutput {
        @builtin(position) clipPos : vec4<f32>,
        @location(0) uv : vec2<f32>,
      };

      @vertex
      fn vs_main(@builtin(vertex_index) vertexIndex : u32) -> VertexOutput {
        var pos = array<vec2<f32>, 4>(
          vec2<f32>(-1.0, -1.0),
          vec2<f32>( 1.0, -1.0),
          vec2<f32>(-1.0,  1.0),
          vec2<f32>( 1.0,  1.0)
        );
        var output : VertexOutput;
        output.clipPos = vec4<f32>(pos[vertexIndex], 0.0, 1.0);
        output.uv = pos[vertexIndex] * 0.5 + 0.5;
        return output;
      }

      fn intersectBox(rayOrigin : vec3<f32>, rayDir : vec3<f32>, boxMin : vec3<f32>, boxMax : vec3<f32>) -> vec2<f32> {
        let invDir = 1.0 / rayDir;
        let t1 = (boxMin - rayOrigin) * invDir;
        let t2 = (boxMax - rayOrigin) * invDir;
        let tMin = min(t1, t2);
        let tMax = max(t1, t2);
        let tNear = max(max(tMin.x, tMin.y), tMin.z);
        let tFar  = min(min(tMax.x, tMax.y), tMax.z);
        return vec2<f32>(tNear, tFar);
      }

      fn sampleGradient(pos : vec3<f32>, step : f32) -> vec3<f32> {
        let eps = vec3<f32>(step, step, step);
        let dx = textureSampleLevel(volumeTexture, volumeSampler, pos + vec3<f32>(eps.x, 0.0, 0.0), 0.0).r -
                 textureSampleLevel(volumeTexture, volumeSampler, pos - vec3<f32>(eps.x, 0.0, 0.0), 0.0).r;
        let dy = textureSampleLevel(volumeTexture, volumeSampler, pos + vec3<f32>(0.0, eps.y, 0.0), 0.0).r -
                 textureSampleLevel(volumeTexture, volumeSampler, pos - vec3<f32>(0.0, eps.y, 0.0), 0.0).r;
        let dz = textureSampleLevel(volumeTexture, volumeSampler, pos + vec3<f32>(0.0, 0.0, eps.z), 0.0).r -
                 textureSampleLevel(volumeTexture, volumeSampler, pos - vec3<f32>(0.0, 0.0, eps.z), 0.0).r;
        let g = vec3<f32>(dx, dy, dz);
        let len = length(g);
        if (len < 0.0001) {
          return vec3<f32>(0.0, 1.0, 0.0);
        }
        return g / len;
      }

      @fragment
      fn fs_main(in : VertexOutput) -> @location(0) vec4<f32> {
        // Fixed vertical orientation (removed Y-flip)
        let screenNear = vec4<f32>(in.uv.x * 2.0 - 1.0, in.uv.y * 2.0 - 1.0, 0.0, 1.0);
        let screenFar  = vec4<f32>(in.uv.x * 2.0 - 1.0, in.uv.y * 2.0 - 1.0, 1.0, 1.0);

        var worldNearH = uniforms.invViewProj * screenNear;
        var worldFarH  = uniforms.invViewProj * screenFar;

        let worldNear = worldNearH.xyz / worldNearH.w;
        let worldFar  = worldFarH.xyz / worldFarH.w;

        let rayOrigin = worldNear;
        let rayDir    = normalize(worldFar - worldNear);

        let hit = intersectBox(rayOrigin, rayDir, vec3<f32>(0.0), vec3<f32>(1.0));
        let tNear = hit.x;
        let tFar  = hit.y;

        let bgColor = vec3<f32>(0.03, 0.04, 0.06);

        if (tNear > tFar || tFar < 0.0) {
          return vec4<f32>(bgColor, 1.0);
        }

        let tStart = max(tNear, 0.0);
        let stepSize = 0.004;
        var rayPos = rayOrigin + rayDir * tStart;
        var accumulatedColor = vec4<f32>(0.0);

        let numSteps = i32((tFar - tStart) / stepSize);
        let lightDir = normalize(vec3<f32>(1.0, 1.8, 1.2));

        for (var i = 0; i < numSteps; i++) {
          let scalarDensity = textureSampleLevel(volumeTexture, volumeSampler, rayPos, 0.0).r;

          if (scalarDensity > uniforms.threshold) {
            let norm = sampleGradient(rayPos, stepSize * 2.0);
            let diff = max(dot(-norm, lightDir), 0.20);

            var baseColor = vec3<f32>(0.88, 0.82, 0.72) * diff;
            if (scalarDensity < 0.50) {
              baseColor = vec3<f32>(0.65, 0.20, 0.15) * diff;
            }

            let alpha = clamp((scalarDensity - uniforms.threshold) * uniforms.densityScale * stepSize, 0.0, 1.0);
            let weight = (1.0 - accumulatedColor.a) * alpha;

            accumulatedColor += vec4<f32>(baseColor * weight, weight);

            if (accumulatedColor.a >= 0.96) {
              break;
            }
          }

          rayPos += rayDir * stepSize;
        }

        let finalColor = mix(bgColor, accumulatedColor.rgb, accumulatedColor.a);
        return vec4<f32>(finalColor, 1.0);
      }
    `;

    async function initEngine() {
      if (!navigator.gpu) {
        document.getElementById('error-modal').style.display = 'flex';
        return;
      }

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        document.getElementById('error-modal').style.display = 'flex';
        return;
      }

      const device = await adapter.requestDevice();
      const canvas = document.getElementById('webgpu-canvas');
      const context = canvas.getContext('webgpu');

      const presentationFormat = navigator.gpu.getPreferredCanvasFormat();
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;

      context.configure({
        device,
        format: presentationFormat,
        alphaMode: 'premultiplied',
      });

      const VOL_DIM = 128;
      const volumeData = generateAnatomicalVolume(VOL_DIM, VOL_DIM, VOL_DIM);

      const volumeTexture = device.createTexture({
        size: [VOL_DIM, VOL_DIM, VOL_DIM],
        dimension: '3d',
        format: 'r8unorm',
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
      });

      device.queue.writeTexture(
        { texture: volumeTexture },
        volumeData,
        { bytesPerRow: VOL_DIM, rowsPerImage: VOL_DIM },
        [VOL_DIM, VOL_DIM, VOL_DIM]
      );

      const volumeSampler = device.createSampler({
        magFilter: 'linear',
        minFilter: 'linear',
      });

      const uniformBuffer = device.createBuffer({
        size: 80,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      const shaderModule = device.createShaderModule({ code: wgslShader });

      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: shaderModule, entryPoint: 'vs_main' },
        fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format: presentationFormat }] },
        primitive: { topology: 'triangle-strip' },
      });

      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: volumeTexture.createView() },
          { binding: 2, resource: volumeSampler },
        ],
      });

      let radius = 2.2, theta = 0.8, phi = 1.2; // Adjusted camera elevation
      let isDragging = false, prevMouseX = 0, prevMouseY = 0;

      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mouseup', () => isDragging = false);

      canvas.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevMouseX;
        const dy = e.clientY - prevMouseY;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;

        theta -= dx * 0.005;
        phi = Math.max(0.1, Math.min(Math.PI - 0.1, phi + dy * 0.005));
      });

      canvas.addEventListener('wheel', (e) => {
        radius = Math.max(1.1, Math.min(5.0, radius + e.deltaY * 0.002));
      });

      const projMatrix = new Float32Array(16);
      const viewMatrix = new Float32Array(16);
      const viewProjMatrix = new Float32Array(16);
      const invViewProj = new Float32Array(16);
      const cameraPos = [0, 0, 0];
      const targetPos = [0.5, 0.5, 0.5];
      const upVector = [0, 1, 0];
      const uniformData = new Float32Array(20);

      function frame() {
        cameraPos[0] = 0.5 + radius * Math.sin(phi) * Math.sin(theta);
        cameraPos[1] = 0.5 + radius * Math.cos(phi);
        cameraPos[2] = 0.5 + radius * Math.sin(phi) * Math.cos(theta);

        const aspect = canvas.width / canvas.height;
        mat4Perspective(projMatrix, Math.PI / 4, aspect, 0.1, 10.0);
        mat4LookAt(viewMatrix, cameraPos, targetPos, upVector);
        mat4Multiply(viewProjMatrix, projMatrix, viewMatrix);
        mat4Invert(invViewProj, viewProjMatrix);

        for (let i = 0; i < 16; i++) uniformData[i] = invViewProj[i];
        uniformData[16] = parseFloat(document.getElementById('threshold-slider').value);
        uniformData[17] = parseFloat(document.getElementById('opacity-slider').value);

        device.queue.writeBuffer(uniformBuffer, 0, uniformData.buffer);

        const commandEncoder = device.createCommandEncoder();
        const textureView = context.getCurrentTexture().createView();

        const renderPass = commandEncoder.beginRenderPass({
          colorAttachments: [{
            view: textureView,
            clearValue: { r: 0.03, g: 0.04, b: 0.06, a: 1.0 },
            loadOp: 'clear',
            storeOp: 'store',
          }],
        });

        renderPass.setPipeline(pipeline);
        renderPass.setBindGroup(0, bindGroup);
        renderPass.draw(4, 1);
        renderPass.end();

        device.queue.submit([commandEncoder.finish()]);

        requestAnimationFrame(frame);
      }

      document.getElementById('threshold-slider').addEventListener('input', (e) => {
        document.getElementById('threshold-val').textContent = parseFloat(e.target.value).toFixed(2);
      });
      document.getElementById('opacity-slider').addEventListener('input', (e) => {
        document.getElementById('opacity-val').textContent = parseFloat(e.target.value).toFixed(1);
      });

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
      });

      requestAnimationFrame(frame);
    }

    initEngine();
  </script>
</body>
</html>
